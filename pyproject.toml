[project]
name = "hosting-app"
version = "0.1.0"
description = "Gestão interna de clientes, subscrições e cobranças de alojamento web."
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "proxmoxer>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # o formatter trata do comprimento; os modelos de email são texto longo
